app = "league-history-nfl-ops-scheduler"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NFL_SEASON = "2026"
  STATE_PATH = "/data/state.json"

[processes]
  scheduler = "python /app/scheduler.py"

[[mounts]]
  source = "nfl_ops_scheduler_state"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
